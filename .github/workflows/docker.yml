name: docker

# Images are published from main and from version tags only. A pull request builds
# nothing, so an untrusted branch cannot push a tag anything deploys from.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Weekly, so the image picks up new yt-dlp releases without a code change.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  image: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The commit is unchanged on the weekly run, so a cached yt-dlp layer would republish
          # the same image. Only a cold build actually picks up a new release.
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Report what was published
        run: docker buildx imagetools inspect ${{ env.image }}:${{ steps.meta.outputs.version }}
