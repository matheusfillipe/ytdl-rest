[project]
name = "ytdl-rest"
version = "0.1.0"
description = "yt-dlp behind a REST and MCP API, answering with a temporary file-host URL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.48",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "fastmcp>=3.4.4",
    "yt-dlp>=2026.8.19",
    "yt-dlp-ejs>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.8",
    "prek>=0.5",
]

[project.scripts]
ytdl-rest = "ytdl_rest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdl_rest"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # builtin shadowing
    "B",     # bugbear
    "C4",    # comprehensions
    "D417",  # documented arguments
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import sorting
    "ICN",   # import conventions
    "N",     # naming
    "PIE",   # misc lints
    "RUF",   # ruff rules
    "SIM",   # simplify
    "TC",    # type-checking blocks
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = ["A002"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["ytdl_rest"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so its models' imports cannot be deferred.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: reaches the real internet and a real file host; skipped unless YTDL_E2E=1",
]

[tool.coverage.run]
source = ["src/ytdl_rest"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
